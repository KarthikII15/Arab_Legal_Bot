version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: legal-assistant-backend
    ports:
      - "5000:5000"
    environment:
      - HOST=0.0.0.0
      - PORT=5000
      - CORS_ORIGINS=http://localhost,http://localhost:3000,http://frontend
      # Adjust threads based on CPU cores (e.g., 4 for typical dev machine)
      - LLM_NUM_THREADS=4
    volumes:
      # Mount models from host to avoid re-downloading during dev (optional)
      # - ./backend/models:/app/models
      # Persist SQLite database
      - backend_data:/app/data
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 8G # Limit memory to avoid system crash (adjust based on host)
        reservations:
          memory: 4G

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: legal-assistant-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend_data:
