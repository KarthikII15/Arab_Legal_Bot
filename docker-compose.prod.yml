version: '3.8'

services:
  backend:
    image: ghcr.io/karthikii15/legal-assistant-backend:latest
    container_name: legal-assistant-backend
    ports:
      - "5000:5000"
    environment:
      - HOST=0.0.0.0
      - PORT=5000
      - CORS_ORIGINS=http://localhost,http://localhost:3000,https://legalbot.motivitylabs.com
      - LLM_NUM_THREADS=4
      - DB_PATH=/app/db/chat_history.db
    volumes:
      - backend_db:/app/db
    restart: always
    deploy:
      resources:
        limits:
          memory: 12G
        reservations:
          memory: 4G

  frontend:
    image: ghcr.io/karthikii15/legal-assistant-frontend:latest
    container_name: legal-assistant-frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      - backend
    restart: always

volumes:
  backend_db:


